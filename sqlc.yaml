version: "2"

sql:
  - engine: "sqlite"
    schema: "migrations/"
    queries: "queries"
    gen:
      go:
        package: "repo"
        out: "internal/repo/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true

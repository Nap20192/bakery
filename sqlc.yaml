version: "2"
overrides:
  go:
    overrides:
      - db_type: "date"
        go_type:
          type: string

      - db_type: "date"
        nullable: true
        go_type:
          type: string
          pointer: true

      - db_type: "timestamptz"
        go_type:
          import: "time"
          type: "Time"

      - db_type: "timestamptz"
        nullable: true
        go_type:
          import: "time"
          type: "Time"
          pointer: true

      - db_type: "boolean"
        go_type:
          type: "bool"

      - db_type: "boolean"
        nullable: true
        go_type:
          type: "bool"
          pointer: true

      - db_type: "text"
        go_type:
          type: "string"

      - db_type: "text"
        nullable: true
        go_type:
          type: "string"
          pointer: true

      - db_type: "integer"
        nullable: true
        go_type:
          type: "int64"
          pointer: true

      - db_type: "jsonb"
        nullable: true
        go_type:
          type: "any"

      - db_type: "pg_catalog.int8"
        go_type: "int64"

      - db_type: "pg_catalog.int8"
        nullable: true
        go_type:
          type: "int64"
          pointer: true

      - db_type: "pg_catalog.timestamptz"
        go_type:
          import: "time"
          type: "Time"

      - db_type: "pg_catalog.timestamptz"
        nullable: true
        go_type:
          import: "time"
          type: "Time"
          pointer: true

      - db_type: "uuid"
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"

      - db_type: "uuid"
        nullable: true
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
          pointer: true

      - db_type: "pg_catalog.numeric"
        go_type: "float64"

      - db_type: "pg_catalog.numeric"
        nullable: true
        go_type:
          type: "float64"
          pointer: true

sql:
  - engine: "postgresql"
    queries: "./queries"
    schema:  "./migration"
    gen:
      go:
        package:                "db"
        out:                    "./internal/adapter/outbound/db"
        emit_json_tags:         true
        emit_interface:         true
        emit_exact_table_names: false
        emit_empty_slices:      true
        sql_package:            "pgx/v5"

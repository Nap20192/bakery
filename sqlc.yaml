version: "2"

sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/outbound/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true

{{define "login"}}
<main class="login-page" data-telegram-login data-next="{{.Data.Next}}">
  <section class="login-form-wrap" aria-label="Вход в систему">
    <form class="stack" action="/session/login" method="post" hx-boost="true" hx-disabled-elt="find button" hx-indicator="#global-progress">
      <input type="hidden" name="next" value="{{.Data.Next}}">
      <div>
        <h2>Войти</h2>
      </div>
      {{if .Error}}{{template "inline-error" .Error}}{{end}}
      <label class="field"><span>Логин</span><input name="username" autocomplete="username" required autofocus></label>
      <label class="field"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button button-primary button-wide" type="submit">Войти</button>
      <p class="form-note telegram-status" role="status">В Telegram вход выполняется автоматически.</p>
    </form>
  </section>
</main>
{{end}}

services:
  app:
    build:
      context: ${DOCKER_BUILD_CONTEXT:-.}
      dockerfile: ${DOCKERFILE:-Dockerfile}
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.26-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.23}
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BOT_ENV: ${BOT_ENV:-test}
      TEST_BOT_TOKEN: ${TEST_BOT_TOKEN:-}
      PROD_BOT_TOKEN: ${PROD_BOT_TOKEN:-}
      MINI_APP_URL: ${MINI_APP_URL:-}
      TELEGRAM_WORKSHOP_CHAT_ID: ${TELEGRAM_WORKSHOP_CHAT_ID:-}
      SQLITE_PATH: /data/bakery.db
      IMPORT_POSTGRES_URL: ${IMPORT_POSTGRES_URL:-}
      LOG_PRETTY: ${DOCKER_LOG_PRETTY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-}
      MIGRATIONS_DIR: ${DOCKER_MIGRATIONS_DIR:-/app/migrations}
      IIKO_HOST: ${IIKO_HOST:-}
      IIKO_PORT: ${IIKO_PORT:-443}
      IIKO_LOGIN: ${IIKO_LOGIN:-}
      IIKO_PASSWORD: ${IIKO_PASSWORD:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-6h}
    volumes:
      - ${DATA_VOLUME:-bakery_data}:/data
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: ${APP_RESTART:-unless-stopped}

volumes:
  bakery_data:
    name: ${DATA_VOLUME:-bakery_data}
